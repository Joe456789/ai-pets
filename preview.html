<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3D 模型預覽</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@4.3.1/dist/model-viewer.min.js"></script>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f3efe6; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 8px; padding: 8px; }
  model-viewer { width: 100%; height: 360px; background: #e8e2d4; border-radius: 10px; }
  p { margin: 4px 8px; font-size: 13px; }
</style>
</head>
<body>
<p id="name"></p>
<div class="grid" id="grid"></div>
<script>
  const file = new URLSearchParams(location.search).get("f") || "output/afu.glb";
  document.getElementById("name").textContent = file;
  // 同一個模型從四個角度看：正面、側面、背面、上方
  const views = ["0deg 80deg 2.2m", "90deg 80deg 2.2m", "180deg 80deg 2.2m", "45deg 30deg 2.2m"];
  for (const o of views) {
    const mv = document.createElement("model-viewer");
    mv.setAttribute("src", file);
    mv.setAttribute("camera-orbit", o);
    mv.setAttribute("camera-controls", "");
    mv.setAttribute("shadow-intensity", "1");
    mv.setAttribute("exposure", "1");
    document.getElementById("grid").appendChild(mv);
  }
</script>
</body>
</html>
